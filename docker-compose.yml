services:
  postgres:
    image: docker.1ms.run/postgres:16-alpine
    environment:
      POSTGRES_USER: panelforge
      POSTGRES_PASSWORD: panelforge_dev
      POSTGRES_DB: panelforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panelforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.1ms.run/redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/dreemerx/panelforge-backend:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env.docker
    environment:
      # 使用容器名连接 postgres 和 redis
      DATABASE_URL: postgresql+asyncpg://panelforge:panelforge_dev@postgres:5432/panelforge
      REDIS_URL: redis://redis:6379/0
      # task_manager / confirm 依赖进程内状态，当前实现默认单 worker 才安全
      WEB_CONCURRENCY: "1"
      # 排除容器内部服务的代理（大小写都设置，覆盖 Docker Desktop 系统级代理）
      NO_PROXY: postgres,redis,localhost,127.0.0.1
      no_proxy: postgres,redis,localhost,127.0.0.1
      # asyncpg 对非 localhost 默认启用 SSL，显式禁用
      PGSSLMODE: disable
    ports:
      - "18765:18765"
    volumes:
      - ./backend/app/static:/app/app/static
    restart: unless-stopped

  frontend:
    image: ghcr.io/dreemerx/panelforge-frontend:latest
    depends_on:
      - backend
    ports:
      - "15173:15173"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

# 如果需要连接到外部 Docker 网络，取消注释并修改网络名
# networks:
#   your_external_network:
#     external: true
